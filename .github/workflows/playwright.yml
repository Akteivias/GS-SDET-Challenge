name: Playwright E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-dev:
    name: Run E2E tests against dev
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Start API container
        run: |
          docker run -d \
            -p 3000:3000 \
            --name api-server \
            ghcr.io/danielsilva-loanpro/sdet-interview-challenge:latest

      - name: Wait for API readiness
        timeout-minutes: 1
        run: |
          echo "Waiting for API to be ready..."
          for i in {1..30}; do
            if curl -s --fail http://localhost:3000/dev/users >/dev/null 2>&1; then
              echo "API is ready after ${i} seconds"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become ready within 30 seconds"
          docker logs api-server
          exit 1

      - name: Run Playwright tests (dev)
        run: PLAYWRIGHT_HTML_OUTPUT_DIR=reports/test-dev npm run test:dev

      - name: Upload dev report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report-dev
          path: reports/test-dev/

  test-prod:
    name: Run E2E tests against prod
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Start API container
        run: |
          docker run -d \
            -p 3000:3000 \
            --name api-server \
            ghcr.io/danielsilva-loanpro/sdet-interview-challenge:latest

      - name: Wait for API readiness
        timeout-minutes: 1
        run: |
          echo "Waiting for API to be ready..."
          for i in {1..30}; do
            if curl -s --fail http://localhost:3000/prod/users >/dev/null 2>&1; then
              echo "API is ready after ${i} seconds"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become ready within 30 seconds"
          docker logs api-server
          exit 1

      - name: Run Playwright tests (prod)
        run: PLAYWRIGHT_HTML_OUTPUT_DIR=reports/test-prod npm run test:prod

      - name: Upload prod report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report-prod
          path: reports/test-prod/

  assemble-pages:
    name: Assemble Pages site
    needs: [test-dev, test-prod]
    if: ${{ always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download dev report artifact
        uses: actions/download-artifact@v7
        with:
          name: playwright-report-dev
          path: site/dev

      - name: Download prod report artifact
        uses: actions/download-artifact@v7
        with:
          name: playwright-report-prod
          path: site/prod

      - name: Generate minimal landing page
        run: |
          mkdir -p site
          cat << 'EOF' > site/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>User Management API v1.0 — Playwright Test Reports</title>
          </head>
          <body>
            <h1>User Management API v1.0 — Playwright Test Reports</h1>
            <p>Static Playwright HTML test reports for the User Management API across dev and prod environments.</p>
            <ul>
              <li><a href="./dev/">Dev Environment Report</a></li>
              <li><a href="./prod/">Prod Environment Report</a></li>
            </ul>
            <p><strong>Note:</strong> Current failing tests expose documented API contract discrepancies. See <a href="https://github.com/Akteivias/GS-SDET-Challenge/blob/main/BUGS.md">BUGS.md</a> for details and contract references.</p>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: assemble-pages
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
